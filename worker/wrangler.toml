name = "nodeaitry-comments"
main = "src/index.js"
compatibility_date = "2026-05-28"
workers_dev = true

[vars]
SITE_URL = "https://nodeaitry.com"
PUBLIC_BASE_URL = "https://comments.nodeaitry.com"
ALLOWED_ORIGINS = "https://nodeaitry.com,http://127.0.0.1:1313,http://localhost:1313"
AUTO_APPROVE = "false"
ADMIN_NAME = "nodeaitry"
ADMIN_EMAILS = ""

[[d1_databases]]
binding = "DB"
database_name = "nodeaitry-comments"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
