baseURL: "https://nodeaitry.com/"
title: nodeaitry.com
copyright: "© nodeaitry.com"
theme: [hugo-PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true
  minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 10

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
languages:
  zh:
    label: "中文"
    locale: "zh-CN"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 首页
          url: /
          weight: 1
        - name: 归档
          url: archives/
          weight: 2
        - name: 标签
          url: tags/
          weight: 3
        - name: 飞行
          url: flights/
          weight: 4
        - name: 碎片
          url: soul/
          weight: 5
        - name: 搜索
          url: search/
          weight: 6
        - name: 关于
          url: about/
          weight: 7
    params:
      description: "记录、分享与归档"
      homeInfoParams:
        Title: "你好 👋"
        Content: |
          我是 **nodeaitry**，在这里记录 AI、工程实践和产品思考。

          这个站点用于长期归档想法、实验和可复用的方法。

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

params:
  env: production
  description: "记录、分享与归档"
  keywords: ["Blog", "AI", "Engineering", "Product", "Hugo", "Cloudflare"]
  author: nodeaitry

  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  comments: true
  commentsApi: "https://comments.nodeaitry.com"
  commentsApiLocal: "http://localhost:8787"
  commentsPageSize: 20
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: nodeaitry.com
    imageUrl: "#"
    imageTitle: nodeaitry.com
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "你好 👋"
    Content: |
      我是 **nodeaitry**，在这里记录 AI、工程实践和产品思考。

      这个站点用于长期归档想法、实验和可复用的方法。

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/CSzcm8788"
    - name: instagram
      title: Instagram
      url: "https://www.instagram.com/yukabiubiu/"
    - name: x
      title: X
      url: "https://x.com/yukabiubiu"
    - name: telegram
      title: Telegram
      url: "https://t.me/yukabiubiu"
    - name: rss
      title: RSS
      url: "/index.xml"

  assets:
    disableHLJS: true

  footer:
    text: 'Powered by [Cloudflare Pages](https://pages.cloudflare.com/), [Workers](https://workers.cloudflare.com/), [D1](https://developers.cloudflare.com/d1/) & [R2](https://www.cloudflare.com/products/r2/)'

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    tabWidth: 2

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
